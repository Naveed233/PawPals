name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo export -p web
        env:
          CI: "1"
          # GitHub Pages project site is served under /PawPals; Cloudflare Pages
          # (and any custom domain) serve at root, so app.config.ts defaults to "/".
          EXPO_BASE_URL: "/PawPals"
          # Map tiles. CARTO watermarks tiles requested without a key; the key
          # is public once built (it is in every tile URL), but kept out of git.
          EXPO_PUBLIC_CARTO_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}

      # SPA fallback so deep links (e.g. /PawPals/dog/dog-luna) load the app
      # instead of GitHub's 404 page
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
